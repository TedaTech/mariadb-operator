name: TeDa Release

# Publishes the TeDa fork image. The tag pattern is deliberately disjoint from
# every upstream workflow: release.yml fires on "[0-9]+.[0-9]+.[0-9]+" (no
# suffix permitted), helm-release*.yml on "mariadb-operator-*", and ci.yml /
# helm.yml only on main and pull requests. Pushing a *-teda.N tag therefore
# triggers this job and nothing else.
#
# linux/amd64 only: every node in the platform cluster is amd64, and a
# QEMU-emulated arm64 Go build costs minutes for nothing.
#
# The published package must be public — the operator writes its own image
# reference into every new HA cluster's spec.replication.agent.image and
# initContainer.image, and those Pods run in tenant namespaces that hold no
# pull secret. See TEDA.md.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-teda.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/mariadb-operator:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=mariadb-operator
            org.opencontainers.image.description=TeDa Tech fork of mariadb-operator with automatic-failover fixes
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
